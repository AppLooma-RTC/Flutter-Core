name: applooma_rtc_core
description: >-
  Media transport core for the AppLooma RTC SDKs. Not intended to be used
  directly — depend on applooma_rtc instead.
version: 2.12.0
homepage: https://applooma.dev
repository: https://github.com/AppLooma-RTC/Flutter-Core
issue_tracker: https://github.com/AppLooma-RTC/Flutter-Core/issues
documentation: https://docs.applooma.dev/sdk/flutter

environment:
  # Flutter 3.38 / Dart 3.10 is the floor for stable native assets
  # (build hooks), which the upcoming Rust core is delivered through.
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  asn1lib: ^1.6.5
  async: ^2.13.0
  collection: ^1.19.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.0
  fixnum: ^1.1.1
  meta: ^1.17.0
  http: ^1.6.0
  logging: ^1.3.0
  uuid: ^4.5.3
  synchronized: ^3.4.0
  protobuf: ^6.0.0
  device_info_plus: '>=12.3.0 <14.0.0'
  sdp_transform: ^0.3.2
  web: ^1.1.1
  mime_type: ^1.0.1
  path: ^1.9.1
  dart_jsonwebtoken: ^3.3.2
  json_annotation: ^4.12.0

  # Fix version to avoid version conflicts between WebRTC-SDK pods, which both this package and flutter_webrtc depend on.
  flutter_webrtc: 1.6.2+hotfix.1
  dart_webrtc: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  mockito: ^5.3.2
  import_sorter: ^4.6.0
  yaml: ^3.1.2
  build_runner: ^2.4.13
  # Narrow pin so committed codegen stays deterministic across machines
  json_serializable: ">=6.14.1 <6.15.0"

import_sorter:
  comments: false
  ignored_files:
    # Ignore proto files
    - \/lib\/src\/proto\/*

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LiveKitPlugin
      android:
        package: io.livekit.plugin
        pluginClass: LiveKitPlugin
      macos:
        pluginClass: LiveKitPlugin
      windows:
        pluginClass: LiveKitPlugin
      linux:
        pluginClass: LiveKitPlugin
      web:
        pluginClass: LiveKitWebPlugin
        fileName: applooma_rtc_core_web.dart

topics:
  - webrtc
  - voip
  - video
  - livestream
  - conference
